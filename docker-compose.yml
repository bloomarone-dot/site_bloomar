services:
  db:
    image: postgres:16-alpine
    container_name: bloomar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloomar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloomar}
      POSTGRES_DB: ${POSTGRES_DB:-bloomar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloomar} -d ${POSTGRES_DB:-bloomar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bloomar-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloomar}:${POSTGRES_PASSWORD:-bloomar}@db:5432/${POSTGRES_DB:-bloomar}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: bloomar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
